name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # WHY a real Postgres service rather than SQLite: the correctness of this
    # codebase rests on Postgres-specific mechanics -- partial unique
    # indexes, SELECT FOR UPDATE, SKIP LOCKED, ON CONFLICT. SQLite has none
    # of them, so a SQLite test run would be green while testing nothing
    # that matters.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # A throwaway Fernet key. Real secrets never reach CI; the encrypted
      # columns only need SOME valid key to round-trip.
      TOKEN_ENCRYPTION_KEYS: 8Zx3vQfK1mN7pR2sT5wY9bC4eH6jL0nQ8rU2xA5dG7k=
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: clinic
      PGPASSWORD: clinic

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Create databases
        run: |
          psql -d clinic -c 'CREATE DATABASE clinic_test;'
          psql -d clinic -c 'CREATE DATABASE clinic_migrated;'
          psql -d clinic -c 'CREATE DATABASE clinic_models;'

      - name: Migrations apply cleanly from empty
        env:
          DATABASE_URL: postgresql+asyncpg://clinic:clinic@localhost:5432/clinic_migrated
        run: alembic upgrade head

      - name: Migrations are reversible
        env:
          DATABASE_URL: postgresql+asyncpg://clinic:clinic@localhost:5432/clinic_migrated
        # A downgrade path nobody exercises is a downgrade path that does not
        # work, discovered during the incident where you need it.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: alembic check (tables, columns, indexes)
        env:
          DATABASE_URL: postgresql+asyncpg://clinic:clinic@localhost:5432/clinic_migrated
        run: alembic check

      # THE CHECK alembic CANNOT DO. See scripts/check_schema_drift.py.
      - name: Schema drift (constraints + indexes, incl. CHECK)
        env:
          MIGRATED_URL: postgresql+asyncpg://clinic:clinic@localhost:5432/clinic_migrated
          MODELS_URL: postgresql+asyncpg://clinic:clinic@localhost:5432/clinic_models
        run: python scripts/check_schema_drift.py

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://clinic:clinic@localhost:5432/clinic_test
        run: pytest -q
